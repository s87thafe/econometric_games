[project]
name = "econometric-games"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Torben", email = "thaferkamp@gmx.de" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "kaleido>=1.5.0",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "plotly>=6.9,<7",
    "pytask>=0.6.0",
]

[project.scripts]
econometric-games = "econometric_games:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY", "PD"]

[tool.pytask.ini_options]
paths = ["src/econometric_games"]
